
name: Update 3D Universe

on:
  schedule:
    - cron: "51 5-23/6 * * *" # Every 6 hours, starting at 05:51 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: false

jobs:
  universe:
    name: Generate and update 3D Universe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Select theme using India time
        id: theme
        shell: bash
        run: |
          set -euo pipefail

          HOUR=$(TZ=Asia/Kolkata date +%H)

          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 18 ]; then
            THEME="daylight"
            MODE="DAY"
          else
            THEME="aurora"
            MODE="NIGHT"
          fi

          echo "theme=$THEME" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "India time hour: $HOUR"
          echo "Selected theme: $THEME"

      - name: Generate Git3D Universe v2.0.0
        uses: SandeepKomal/Git3D-Universe@v2.0.0
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: ${{ steps.theme.outputs.theme }}
          output: cards/universe.svg

      - name: Validate generated SVG
        shell: bash
        env:
          SVG: cards/universe.svg
          EXPECTED_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ ! -s "$SVG" ]; then
            echo "::error::SVG is missing or empty: $SVG"
            exit 1
          fi

          grep -q '<svg' "$SVG"
          grep -q '</svg>' "$SVG"
          grep -qi "@${EXPECTED_LOGIN}" "$SVG"
          grep -q "contributions" "$SVG"
          grep -q "active days" "$SVG"
          grep -q "current streak" "$SVG"
          grep -q "longest streak" "$SVG"

          if grep -q "Ada Example" "$SVG" || grep -q "ada-example" "$SVG"; then
            echo "::error::Sample profile content detected."
            exit 1
          fi

          SIZE=$(wc -c < "$SVG")

          if [ "$SIZE" -lt 5000 ]; then
            echo "::error::Generated SVG is unexpectedly small."
            exit 1
          fi

          echo "SVG validation passed."

      - name: Commit updated universe
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cards/universe.svg

          if git diff --cached --quiet; then
            echo "The 3D Universe has not changed. Nothing to commit."
            exit 0
          fi

          git commit -m "Update 3D Universe (${{ steps.theme.outputs.mode }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
