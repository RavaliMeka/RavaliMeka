name: Profile Observatory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: profile-observatory
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Observatory
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - theme: aurora
            output: profile/observatory-dark.svg

          - theme: daylight
            output: profile/observatory-light.svg

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout Profile Observatory source
        uses: actions/checkout@v4
        with:
          repository: RavaliMeka/profile-observatory
          path: .observatory
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Observatory
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          THEME: ${{ matrix.theme }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail

          mkdir -p profile

          echo "Generating ${THEME} Observatory for ${USERNAME}..."

          node .observatory/src/cli.mjs \
            --user "${USERNAME}" \
            --theme "${THEME}" \
            --out "${OUTPUT}"

          test -s "${OUTPUT}"

          echo "Generated:"
          ls -lh "${OUTPUT}"

      - name: Validate generated SVG
        shell: bash
        env:
          SVG: ${{ matrix.output }}
        run: |
          set -euo pipefail

          echo "Validating ${SVG}..."

          test -f "${SVG}"
          test -s "${SVG}"

          grep -q "<svg" "${SVG}"
          grep -q "</svg>" "${SVG}"

          # Verify profile identity
          grep -q "Ravali Meka" "${SVG}"
          grep -q "RavaliMeka" "${SVG}"

          # Verify Observatory content
          grep -q "Contribution Observatory" "${SVG}"
          grep -q "CONTRIBUTIONS" "${SVG}"
          grep -q "REPOSITORIES" "${SVG}"
          grep -q "STARS" "${SVG}"

          # Make sure sample data is not being rendered
          if grep -q "Ada Example" "${SVG}"; then
            echo "ERROR: sample data detected"
            exit 1
          fi

          if grep -q "ada-example" "${SVG}"; then
            echo "ERROR: sample GitHub login detected"
            exit 1
          fi

          SIZE=$(wc -c < "${SVG}")

          echo "SVG size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 5000 ]; then
            echo "ERROR: generated SVG is unexpectedly small"
            exit 1
          fi

          echo "SVG validation passed."

      - name: Upload generated SVG
        uses: actions/upload-artifact@v4
        with:
          name: observatory-${{ matrix.theme }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Observatory
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dark SVG
        uses: actions/download-artifact@v4
        with:
          name: observatory-aurora
          path: generated/dark

      - name: Download light SVG
        uses: actions/download-artifact@v4
        with:
          name: observatory-daylight
          path: generated/light

      - name: Publish SVGs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p profile

          cp generated/dark/observatory-dark.svg \
            profile/observatory-dark.svg

          cp generated/light/observatory-light.svg \
            profile/observatory-light.svg

          test -s profile/observatory-dark.svg
          test -s profile/observatory-light.svg

          echo "Published:"
          ls -lh profile/observatory-*.svg

      - name: Validate README references
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking README Observatory references..."

          grep -q './profile/observatory-dark.svg' README.md
          grep -q './profile/observatory-light.svg' README.md

          echo "README references validated."

      - name: Validate published SVGs
        shell: bash
        run: |
          set -euo pipefail

          test -f profile/observatory-dark.svg
          test -f profile/observatory-light.svg

          test -s profile/observatory-dark.svg
          test -s profile/observatory-light.svg

          grep -q "<svg" profile/observatory-dark.svg
          grep -q "<svg" profile/observatory-light.svg

          echo "Published SVG validation passed."

      - name: Commit generated Observatory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/observatory-dark.svg
          git add profile/observatory-light.svg

          if git diff --cached --quiet; then
            echo "No Observatory changes detected."
            exit 0
          fi

          git commit -m "chore: update profile observatory"

          git push origin main

      - name: Summary
        shell: bash
        run: |
          echo "========================================"
          echo "Profile Observatory completed"
          echo "========================================"
          echo "Dark:  profile/observatory-dark.svg"
          echo "Light: profile/observatory-light.svg"
          echo "Repository: RavaliMeka/RavaliMeka"
          echo "Generator: RavaliMeka/profile-observatory"
