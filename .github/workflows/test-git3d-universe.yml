name: Git3D Universe v2.0.1 Test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: git3d-universe
  cancel-in-progress: true

env:
  GIT3D_TIMEZONE: Asia/Kolkata
  GIT3D_DAY_START: "06"
  GIT3D_NIGHT_START: "18"

jobs:
  generate:
    name: Generate and Validate Git3D Universe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine local theme
        id: theme
        shell: bash
        env:
          TIMEZONE: ${{ env.GIT3D_TIMEZONE }}
          DAY_START: ${{ env.GIT3D_DAY_START }}
          NIGHT_START: ${{ env.GIT3D_NIGHT_START }}
        run: |
          set -euo pipefail

          HOUR=$(TZ="$TIMEZONE" date +%H)

          if [ "$HOUR" -ge "$DAY_START" ] && [ "$HOUR" -lt "$NIGHT_START" ]; then
            echo "theme=daylight" >> "$GITHUB_OUTPUT"
          else
            echo "theme=aurora" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Git3D Universe v2.0.1
        uses: SandeepKomal/Git3D-Universe@v2.0.1
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: ${{ steps.theme.outputs.theme }}
          output: profile/git3d-universe.svg

      - name: Validate generated SVG and creator credit
        shell: bash
        run: |
          set -euo pipefail

          SVG="profile/git3d-universe.svg"

          test -s "$SVG"
          grep -q "<svg" "$SVG"
          grep -q "</svg>" "$SVG"
          grep -Fq "crafted by Sandeep Komal Pothu" "$SVG"

          echo "SVG generated successfully."
          echo "Creator credit verified."
          echo "Theme: ${{ steps.theme.outputs.theme }}"

      - name: Commit generated SVG
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d-universe.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update Git3D Universe v2.0.1"
          git push origin main
